// SPDX-License-Identifier: Apache-2.0
// VPN-пакет (E25, раздел 6): точки замера. Движок — по имени из зашитой таблицы помощника, скачивается отдельно
// и в сборку агента не входит. Тестовый доступ приходит зашифрованным на ключ помощника (HPKE, как в E13).
// Решения — docs/plan/decisions/E25-agent.md.
syntax = "proto3";

package trassa.agent.v1;

import "trassa/agent/v1/backup.proto";

option go_package = "github.com/NogMeer/trassa-agent/gen/trassa/agent/v1;agentv1";

// vpn.probe.ensure (CHANGE, rollback CONFIG: прежняя версия движка возвращается). Скачивает агент без прав,
// помощник сверяет sha256 с параметрами и со своей таблицей и ставит в /var/lib/trassa/vpn-probe/.
message VpnProbeEnsureParams {
  // Имя из таблицы помощника; неизвестное — VPN_PROBE_ENGINE_UNKNOWN.
  string engine = 1;
  // semver; версии нет в таблице — VPN_PROBE_ENGINE_UNKNOWN.
  string version = 2;
  // hex, 64 знака; сверяется после скачивания и с таблицей помощника (иначе SHA256_MISMATCH).
  string sha256 = 3;
  // https, источник выпуска (как DeployTool.url); хост — из таблицы помощника.
  string url = 4;
}

message VpnProbeEnsureResult {
  string engine = 1;
  // Что вернул пробный запуск движка.
  string version = 2;
  string sha256 = 3;
  uint64 size_bytes = 4;
  // Пусто — ставился впервые.
  string previous_version = 5;
}

// vpn.probe.run (READ). Без предпросмотра; dry_run — отказ. Движок запускает помощник от пользователя trassa с
// пределами ресурсов; слушает только 127.0.0.1, исходящие — только на allowed_endpoints.
message VpnProbeRunParams {
  // uuid замера на панели.
  string check_id = 1;
  // Имя установленного движка; не установлен — VPN_PROBE_ENGINE_MISSING.
  string engine = 2;
  // 30–300.
  uint32 hold_seconds = 3;
  // Что запрашивать через цепочку: https:// или http:// на имя хоста, порт 80 или 443.
  string target_url = 4;
  // ≤ 600 и > hold_seconds.
  uint32 timeout_seconds = 5;
  // Тестовый доступ; info: field "vpn_probe_config", plan_id = route_id. Формат текста — decisions E25-agent.
  SealedSecret config = 6;
  // IPv4/IPv6 серверов цепочки, 1–100; адрес входа из доступа вне списка — VPN_PROBE_ENDPOINT_FORBIDDEN.
  repeated string allowed_endpoints = 7;
  // 2–12, число звеньев цепочки для разметки hops.
  uint32 hop_count = 8;
  // id цепочки (uuid): plan_id в info секрета config.
  string route_id = 9;
}

enum VpnProbeStatus {
  VPN_PROBE_STATUS_UNSPECIFIED = 0;
  // Поток держался hold_seconds.
  VPN_PROBE_STATUS_OK = 1;
  // Соединение было, поток оборвался (held_seconds < hold_seconds).
  VPN_PROBE_STATUS_RESET = 2;
  // Соединение не установилось.
  VPN_PROBE_STATUS_FAILED = 3;
}

message VpnProbeHop {
  // 0..hop_count-1, порядок цепочки.
  uint32 index = 1;
  bool reachable = 2;
  // 0 — не измерено.
  uint32 latency_ms = 3;
  // Код ^[A-Z_]{1,40}$ или пусто: TCP_REFUSED, HANDSHAKE_FAILED, STREAM_RESET…
  string note = 4;
}

message VpnProbeRunResult {
  // = params.check_id, иначе панель отклонит итог.
  string check_id = 1;
  VpnProbeStatus status = 2;
  // До первого байта ответа target_url.
  uint32 latency_ms = 3;
  uint32 held_seconds = 4;
  // Не задано — не определено или обрыва нет.
  optional uint32 first_broken_hop = 5;
  // ≤ 12.
  repeated VpnProbeHop hops = 6;
  string engine_version = 7;
  uint64 bytes_transferred = 8;
  // Простая TCP-проверка порта входа (приёмка 12.4: порт «работает», поток нет).
  bool entry_port_open = 9;
}
