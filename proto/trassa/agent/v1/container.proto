// Обновление образа контейнера docker compose (E10, рекомендации обновлений). Решения — docs/plan/decisions/
// E10-image-updates.md панели, раздел 7.
syntax = "proto3";

package trassa.agent.v1;

option go_package = "github.com/NogMeer/trassa-agent/gen/trassa/agent/v1;agentv1";

// container.update (CHANGE; мажорная версия — DESTRUCTIVE в панели; rollback RELEASE — возврат внутри операции).
// Помощник меняет тег образа одного сервиса compose: в compose-файле или в переменной .env, если тег берётся из
// неё; затем `docker compose pull <сервис>` и `up -d --no-deps --no-build <сервис>`, ждёт running (и healthy, если
// у контейнера есть проверка здоровья). Неуспех — прежний файл и прежний образ обратно, `up -d` того же сервиса.
// Все значения проверяются строгими выражениями и передаются программам отдельными аргументами, без оболочки.
message ContainerUpdateParams {
  // Имя контейнера из инвентаря: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$.
  string container = 1;
  // Метки com.docker.compose.project и com.docker.compose.service: должны совпасть с метками контейнера.
  string project = 2;
  string service = 3;
  // Образ, который панель видела в инвентаре (Config.Image): другой на сервере — CONTAINER_IMAGE_CHANGED.
  string current_image = 4;
  // Новый тег: ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$. Равен текущему — только pull и пересоздание (плавающий тег).
  string target_tag = 5;
  // Сколько ждать running/healthy после up, 30–600 с.
  uint32 wait_sec = 6;
}

enum ContainerUpdateSource {
  CONTAINER_UPDATE_SOURCE_UNSPECIFIED = 0;
  // Тег записан в compose-файле.
  CONTAINER_UPDATE_SOURCE_COMPOSE_FILE = 1;
  // Тег — значение переменной из .env (image: nginx:${NGINX_TAG} или image: ${IMAGE}).
  CONTAINER_UPDATE_SOURCE_ENV_FILE = 2;
  // Тег тот же: только pull и пересоздание.
  CONTAINER_UPDATE_SOURCE_PULL_ONLY = 3;
}

message ContainerUpdateResult {
  string previous_image = 1;
  string new_image = 2;
  ContainerUpdateSource source = 3;
  // Изменённый файл (compose или .env); у PULL_ONLY пусто.
  string file = 4;
  // Состояние нового (или возвращённого) контейнера: running, exited…; health — healthy, unhealthy или пусто.
  string state = 5;
  string health = 6;
  // Возврат прежнего образа выполнен (итог ROLLED_BACK).
  bool rolled_back = 7;
}
