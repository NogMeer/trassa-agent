// SPDX-License-Identifier: Apache-2.0
// Центр безопасности (E10, раздел 6): скан проверок только чтением и список обновлений пакетов.
// Поля с данными сервера проходят фильтр секретов на сервере; содержимого ключей и хэшей паролей здесь нет —
// только отпечатки и имена. Результат операции не больше 1 МБ.
syntax = "proto3";

package trassa.agent.v1;

option go_package = "github.com/NogMeer/trassa-agent/gen/trassa/agent/v1;agentv1";

// security.scan (READ). checks — коды из каталога E10; пустой список отклоняется (R1).
message SecurityScanParams {
  repeated string checks = 1;
  // Отпечаток базового списка детектора, который знает панель; пусто — панель списка не знает.
  string baseline_digest = 2;
}

enum CheckState {
  CHECK_STATE_UNSPECIFIED = 0;
  CHECK_STATE_PASS = 1;
  CHECK_STATE_FAIL = 2;
  // Проверка к этому серверу не относится (например, Docker не установлен).
  CHECK_STATE_NA = 3;
  CHECK_STATE_ERROR = 4;
}

message CheckResult {
  string code = 1;
  // На чём сработало: порт, пользователь, файл, раздел; у проверок сервера целиком — пусто.
  string subject = 2;
  CheckState state = 3;
  // Короткое пояснение для человека, до 2 КБ, без секретов. Панель выводит его только как текст.
  string evidence = 4;
  // Для ERROR: TIMEOUT, UNSUPPORTED, READ_FAILED.
  string error = 5;
}

// Слушающий сокет.
message Listener {
  // tcp или udp.
  string protocol = 1;
  string address = 2;
  uint32 port = 3;
  // Имя процесса; пусто — не определено.
  string process = 4;
  // Имя контейнера Docker, если сокет принадлежит контейнеру или его docker-proxy.
  string container = 5;
  // Адрес не loopback и не только приватный: порт может быть виден снаружи. Доступность снаружи проверяет панель.
  bool public = 6;
}

// Действующие настройки сервера SSH.
message SshEffective {
  // Пары из `sshd -T`, только известные Trassa ключи, в нижнем регистре.
  map<string, string> settings = 1;
  repeated uint32 ports = 2;
  // Порт задаётся сокетом systemd (ssh.socket), а не только sshd_config.
  bool socket_activated = 3;
}

message FirewallState {
  // nftables, iptables-legacy или none.
  string backend = 1;
  bool ufw_active = 2;
  bool firewalld_active = 3;
  // Таблица Trassa загружена.
  bool trassa_table = 4;
  // Хэш загруженного набора Trassa (тот же расчёт, что у firewall.plan).
  string trassa_ruleset_hash = 5;
  // iptables, nftables или none.
  string docker_backend = 6;
}

message SecurityScanResult {
  repeated CheckResult checks = 1;
  repeated Listener listeners = 2;
  // Адреса интерфейсов сервера в виде CIDR.
  repeated string addresses = 3;
  FirewallState firewall = 4;
  SshEffective ssh = 5;
  // Отпечатки базового списка детектора (sha256 записей).
  repeated string baseline = 6;
  string baseline_digest = 7;
}

// packages.list_updates (READ): только чтение кэша apt, без сети.
message PackagesListUpdatesParams {}

message PackageUpdate {
  string name = 1;
  string current = 2;
  string candidate = 3;
  // Кандидат из источника обновлений безопасности.
  bool security = 4;
  // Когда опубликован кандидат; 0 — неизвестно.
  int64 published_at_ms = 5;
}

message PackagesListUpdatesResult {
  repeated PackageUpdate packages = 1;
  bool reboot_required = 2;
  // Пакеты, которым нужна перезагрузка.
  repeated string reboot_packages = 3;
}

// ---------- Блок B: изменения с точкой отката (E10, раздел 6) ----------

// security.fix.<код>: исправление одной проверки каталога. Код — в типе операции. subjects — объекты из
// результата скана (файлы, пользователи, параметры ядра); пустой список отклоняется (R1).
message SecurityFixParams {
  repeated string subjects = 1;
}

enum RootLogin {
  // Не менять.
  ROOT_LOGIN_UNSPECIFIED = 0;
  // root по SSH не входит.
  ROOT_LOGIN_NO = 1;
  // root входит только по ключу (prohibit-password).
  ROOT_LOGIN_KEY_ONLY = 2;
}

enum CryptoPreset {
  // Не менять.
  CRYPTO_PRESET_UNSPECIFIED = 0;
  // Строгий набор по ssh-audit (decisions E10, п. 4).
  CRYPTO_PRESET_STRICT = 1;
}

// ssh.harden (DESTRUCTIVE, CONFIG + автооткат, confirm_within_sec = 300). Ноль и отсутствие значения — не менять.
message SshHardenParams {
  optional bool password_auth = 1;
  RootLogin root_login = 2;
  uint32 port = 3;
  uint32 max_auth_tries = 4;
  CryptoPreset crypto_preset = 5;
  optional bool empty_passwords = 6;
  // X11Forwarding no (E10-T13-R1, находка SSH_FORWARDING); только выключение, true отклоняется.
  optional bool x11_forwarding = 7;
}

enum FirewallTarget {
  FIREWALL_TARGET_UNSPECIFIED = 0;
  // Трафик к самому серверу (цепочка input).
  FIREWALL_TARGET_HOST = 1;
  // Опубликованные порты контейнеров (цепочка forward).
  FIREWALL_TARGET_CONTAINERS = 2;
  FIREWALL_TARGET_BOTH = 3;
}

// Разрешающее правило: всё, что не разрешено, на внешних интерфейсах закрыто.
message FirewallRule {
  FirewallTarget target = 1;
  // tcp или udp.
  string protocol = 2;
  uint32 port = 3;
  // Конец диапазона; 0 — один порт.
  uint32 port_to = 4;
  // Источники в виде CIDR; пусто — любые.
  repeated string sources = 5;
  string comment = 6;
}

// Набор Trassa целиком. ruleset_hash — sha256 (hex) канонического JSON набора по RFC 8785, как planHash.
message FirewallRuleset {
  repeated FirewallRule rules = 1;
  uint32 ssh_port = 2;
}

enum FirewallPlanMode {
  FIREWALL_PLAN_MODE_UNSPECIFIED = 0;
  // Разница с загруженным набором.
  FIREWALL_PLAN_MODE_DIFF = 1;
  // Правила ufw и чужих таблиц в формате Trassa; на сервер ничего не пишется.
  FIREWALL_PLAN_MODE_IMPORT = 2;
}

// firewall.plan (READ).
message FirewallPlanParams {
  FirewallPlanMode mode = 1;
  FirewallRuleset ruleset = 2;
}

message FirewallPlanResult {
  string ruleset_hash = 1;
  // Набор nftables, который применит firewall.apply.
  string nft_text = 2;
  repeated string diff = 3;
  repeated FirewallRule imported = 4;
  repeated string warnings = 5;
}

enum FirewallApplyMode {
  FIREWALL_APPLY_MODE_UNSPECIFIED = 0;
  FIREWALL_APPLY_MODE_APPLY = 1;
  // Снять таблицу Trassa.
  FIREWALL_APPLY_MODE_REMOVE = 2;
}

// firewall.apply (DESTRUCTIVE, CONFIG + автооткат, confirm_within_sec = 120).
message FirewallApplyParams {
  FirewallRuleset ruleset = 1;
  string ruleset_hash = 2;
  FirewallApplyMode mode = 3;
}

enum UpgradeScope {
  UPGRADE_SCOPE_UNSPECIFIED = 0;
  UPGRADE_SCOPE_SECURITY = 1;
  UPGRADE_SCOPE_ALL = 2;
}

// packages.upgrade (CHANGE). Предпросмотр — dry_run.
message PackagesUpgradeParams {
  UpgradeScope scope = 1;
}

// system.reboot (DESTRUCTIVE).
message SystemRebootParams {
  uint32 delay_seconds = 1;
}

// service.restart (CHANGE).
// Цель service.restart и service.start (E18): пусто — служба systemd (как в E10).
enum ServiceTargetKind {
  SERVICE_TARGET_KIND_UNSPECIFIED = 0;
  SERVICE_TARGET_KIND_SYSTEMD = 1;
  // Контейнер Docker по имени; контейнеры приложений и инфраструктуры Trassa отклоняются.
  SERVICE_TARGET_KIND_CONTAINER = 2;
}

// service.restart (E10) и service.start (E18): unit — для SYSTEMD, container — для CONTAINER.
message ServiceRestartParams {
  string unit = 1;
  ServiceTargetKind kind = 2;
  string container = 3;
}

// Итог service.restart и service.start: цель работает 60 с подряд тем же процессом.
message ServiceRestartResult {
  bool active = 1;
  int64 active_since_ms = 2;
  // systemd NRestarts или Docker RestartCount; нет свойства — 0.
  uint32 restarts = 3;
  // ActiveState/SubState или State.Status.
  string state = 4;
}

// disk.cleanup (E18, CHANGE, rollback NONE): только восстановимое; тома Docker не трогаются никогда.
enum DiskCleanupCategory {
  DISK_CLEANUP_CATEGORY_UNSPECIFIED = 0;
  // Архивные файлы журнала systemd старше journal_keep_days.
  DISK_CLEANUP_CATEGORY_JOURNAL = 1;
  // /var/cache/apt/archives (apt-get clean).
  DISK_CLEANUP_CATEGORY_APT_CACHE = 2;
  // Образы без контейнеров, старше docker_unused_older_than_hours, кроме образов Trassa.
  DISK_CLEANUP_CATEGORY_DOCKER_UNUSED = 3;
  // Кэш сборки, не использованный docker_unused_older_than_hours.
  DISK_CLEANUP_CATEGORY_DOCKER_BUILD_CACHE = 4;
}

message DiskCleanupParams {
  // Пусто — отказ (R1).
  repeated DiskCleanupCategory categories = 1;
  // 1–365; 0 — 7.
  uint32 journal_keep_days = 2;
  // 1–8760; 0 — 24.
  uint32 docker_unused_older_than_hours = 3;
  // Раздел для «свободно до и после»; пусто — "/".
  string mount = 4;
}

message DiskCleanupFreed {
  DiskCleanupCategory category = 1;
  // dry_run — оценка (верхняя граница).
  uint64 bytes = 2;
  string error = 3;
}

message DiskCleanupResult {
  repeated DiskCleanupFreed freed = 1;
  uint64 free_before_bytes = 2;
  uint64 free_after_bytes = 3;
}

// cert.renew (E18, CHANGE, rollback CONFIG): сертификат certbot по имени (--cert-name).
message CertRenewParams {
  string domain = 1;
}

message CertRenewResult {
  int64 not_after_before_ms = 1;
  int64 not_after_ms = 2;
  string issuer = 3;
}

// ---------- Блок C: детектор ----------

// security.baseline.accept (CHANGE, rollback NONE): «Это сделал я» — объекты детектора с этими отпечатками
// переходят в базовый список сервера и больше не дают событий. Пустой список отклоняется (R1). Отпечаток — из
// атрибута fingerprint события security.suspicious.
message SecurityBaselineAcceptParams {
  repeated string fingerprints = 1;
}
